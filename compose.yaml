services:
  ms-rewards:
    image: ghcr.io/sellength/ms-rewards-enhanced:0.1.0
    container_name: ms-rewards-enhanced
    restart: unless-stopped
    ports:
      - '3888:3888'                 # Fluent Web 控制台端口
    volumes:
      - ./config:/usr/src/microsoft-rewards-script/config
      - ./sessions:/usr/src/microsoft-rewards-script/sessions
    env_file:
      - path: .env
        required: false
    environment:
      TZ: 'Asia/Shanghai'           # 容器时区
      NODE_ENV: 'production'
      WEB_MODE: 'true'              # 默认启用 Fluent Web 控制台模式
      HOST: '0.0.0.0'               # 允许局域网远程访问
      ALLOWED_HOSTS: 'localhost,127.0.0.1,192.168.*,10.*' # DNS 重绑定防护白名单
      # RUN_ON_START: 'true'        # 容器启动时是否立即触发一次任务执行
      # CRON_SCHEDULE: '0 8 * * *'  # 每日定时执行计划 (如每天 08:00)
      # SKIP_RANDOM_SLEEP: 'false'  # 是否跳过启动前的随机拟人化防风控等待

    healthcheck:
      test: ['CMD-SHELL', 'scripts/docker/healthcheck.sh']
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s

    security_opt:
      - no-new-privileges:true
