name: Release and Docker Publish

on:
    push:
        branches: ['dev']
    workflow_dispatch:

permissions:
    contents: write
    packages: write

env:
    REGISTRY: ghcr.io

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Read current version
              id: version
              run: |
                  set -euo pipefail
                  CUR_VERSION="$(node -p "require('./package.json').version")"
                  echo "current=$CUR_VERSION" >> "$GITHUB_OUTPUT"
                  echo "LOG: Current version: $CUR_VERSION"

            - name: Normalize image name (lowercase)
              id: image
              run: |
                  set -euo pipefail
                  IMG="$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
                  echo "name=$IMG" >> "$GITHUB_OUTPUT"
                  echo "LOG: Image: ${{ env.REGISTRY }}/$IMG"

            - name: Check if GitHub Release already exists
              id: relcheck
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  set -euo pipefail
                  TAG="v${{ steps.version.outputs.current }}"
                  echo "LOG: Checking GitHub Release for tag: $TAG"
                  set +e
                  gh api "repos/${{ github.repository }}/releases/tags/$TAG" >/dev/null 2>&1
                  CODE=$?
                  set -e
                  if [ "$CODE" -eq 0 ]; then
                    echo "LOG: Release exists for $TAG"
                    echo "exists=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "LOG: Release does not exist for $TAG"
                    echo "exists=false" >> "$GITHUB_OUTPUT"
                  fi

            - name: Create GitHub Release
              if: steps.relcheck.outputs.exists != 'true'
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: v${{ steps.version.outputs.current }}
                  target_commitish: ${{ github.sha }}
                  name: v${{ steps.version.outputs.current }}
                  generate_release_notes: true

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Log in to DockerHub (Optional if secrets provided)
              if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
              env:
                  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
                  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Compute image tags
              id: tags
              run: |
                  set -euo pipefail
                  IMG="${{ env.REGISTRY }}/${{ steps.image.outputs.name }}"
                  VER="${{ steps.version.outputs.current }}"
                  MAJOR="${VER%%.*}"
                  TAGS="$IMG:$VER"$'\n'"$IMG:$MAJOR"$'\n'"$IMG:latest"$'\n'"$IMG:dev"

                  if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ]; then
                    DH_REPO="${{ secrets.DOCKERHUB_USERNAME }}/ms-rewards-enhanced"
                    TAGS="$TAGS"$'\n'"$DH_REPO:$VER"$'\n'"$DH_REPO:latest"
                  fi

                  { echo "list<<EOF"; echo "$TAGS"; echo "EOF"; } >> "$GITHUB_OUTPUT"
                  echo "LOG: Tags:"
                  echo "$TAGS"

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v3

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Build and push Docker image
              uses: docker/build-push-action@v5
              with:
                  context: .
                  push: true
                  platforms: linux/amd64,linux/arm64
                  tags: ${{ steps.tags.outputs.list }}
                  cache-from: type=gha,scope=${{ github.ref_name }}
                  cache-to: type=gha,scope=${{ github.ref_name }},mode=max
